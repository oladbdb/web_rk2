<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <title>Sneaker Step</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Веб-технологии Байкова Мария 231-3212" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jura:wght@300..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="cart.css" />
    </head>
    <body>
        <header>
            <h1>Sneaker Step</h1>
            <nav>
              <a href="index.html"><img class="logo" src="img/logo.svg" alt="Логотип" /></a>
              <a href="#section-1">Главная</a>
              <a href="shop.html">Магазин</a>
              <a href="cart.html" class="active">Корзина</a>
              <a href="#footer">Контакты</a>
            </nav>
        </header>
    <main>
        <section id="order">
            <h2>Состав заказа</h2>
            <div id="selected-dishes" class="selected-dishes">
            </div>
        </section>

        <section id="order_form">
            <h2 class="order">Оформление заказа</h2>
            <form action="https://httpbin.org/post" method="POST">
                <div class="order-form">
                    <div class="input-block">
                        <h3>Ваши данные</h3>

                        <label for="name">
                            <p class="input-title">Имя</p>
                            <input type="text" size="40" id="name" name="name" required />
                        </label>

                        <label for="email">
                            <p class="input-title">Email</p>
                            <input type="email" size="40" id="email" name="email" required />
                        </label>

                        <div>
                            <label for="newsletter">
                                <input type="checkbox" id="newsletter" name="newsletter" value="yes" checked />
                                <span class="input-title">Получать информацию о скидках и акциях</span>
                            </label>
                        </div>

                        <label for="tel">
                            <p class="input-title">Номер телефона</p>
                            <input type="tel" id="tel" name="tel" required />
                        </label>

                        <label for="adress">
                            <p class="input-title">Адрес доставки</p>
                            <input type="text" id="adress" name="adress" required />
                            <p class="input-info">Доставка осуществляется только по Москве</p>
                        </label>

                        <div class="buttons">
                            <button type="reset" id="reset-order">Сбросить</button>
                            <button type="submit" id="send-order">Отправить</button>
                        </div>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <footer id="footer">
      <p class="footer">
        Позвонить нам: <a href="+7-900-000-00-00" class="footer">+7-900-000-00-00</a>
      </p>
    </footer>

  </body>
</html>
